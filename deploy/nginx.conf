# /etc/nginx/sites-available/hackalem — HTTPS-часть добавляется после выпуска сертификата (server-bootstrap.sh).
server {
    server_name __DOMAIN__;

    # Свой лог: общий access.log читает серверный fail2ban-jail (10 ответов 401 за 5 минут → бан IP на час).
    # На площадке у всех один внешний IP — чужие опечатки в пароле не должны банить всех.
    access_log /var/log/nginx/hackalem.access.log;
    error_log /var/log/nginx/hackalem.error.log;

    include snippets/oqcrm-security-headers.conf;

    root /opt/hackalem/current/web;
    index index.html;
    client_max_body_size 30m;

    location /api/ {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:__PORT__;
        access_log off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include snippets/oqcrm-security-headers.conf;
    }

    # index.html всегда перепроверяется, иначе после деплоя браузер попросит удалённый бандл
    location = /index.html {
        add_header Cache-Control "no-cache";
        include snippets/oqcrm-security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name __DOMAIN__;
    access_log /var/log/nginx/hackalem.access.log;

    location /.well-known/acme-challenge/ {
        root /var/www/hackalem-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
